version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: routewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routewisedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routewisedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - routewise-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routewise-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-routewisedb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      OSRM_TIMEOUT_MS: ${OSRM_TIMEOUT_MS:-4000}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_TIMEOUT_MS: ${NOMINATIM_TIMEOUT_MS:-3000}
      EXACT_ALGORITHM_MAX_STOPS: ${EXACT_ALGORITHM_MAX_STOPS:-12}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - routewise-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routewise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - routewise-net

volumes:
  pgdata:
    driver: local

networks:
  routewise-net:
    driver: bridge
